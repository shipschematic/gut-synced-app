name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gutsynced-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package app
        run: |
          cd build/ios/iphoneos
          zip -qry "$GITHUB_WORKSPACE/gutsynced-ios-unsigned.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: gutsynced-ios-unsigned
          path: gutsynced-ios-unsigned.zip
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/GutSynced.app \
            gutsynced-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gutsynced-macos
          path: gutsynced-macos.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package app
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) {
            $release = "build/windows/runner/Release"
          }
          Compress-Archive -Path "$release/*" -DestinationPath "gutsynced-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gutsynced-windows
          path: gutsynced-windows.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package app
        run: |
          tar -czf gutsynced-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: gutsynced-linux-x64
          path: gutsynced-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec version
        run: |
          version=$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' pubspec.yaml)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv dist/app-release.apk "dist/gutsynced-${version}-android.apk"
          mv dist/gutsynced-ios-unsigned.zip "dist/gutsynced-${version}-ios-unsigned.zip"
          mv dist/gutsynced-macos.zip "dist/gutsynced-${version}-macos.zip"
          mv dist/gutsynced-windows.zip "dist/gutsynced-${version}-windows.zip"
          mv dist/gutsynced-linux-x64.tar.gz "dist/gutsynced-${version}-linux-x64.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "GutSynced $GITHUB_REF_NAME" \
            --generate-notes
